  <meta charset="UTF-8">
  <title>Thank You - Diigima Creative Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Preload and load the font -->
  <link rel="stylesheet" href="/assets/css/fonts.css?v=2026.7">
  <meta name="robots" content="noindex, nofollow">
  <style>
    /* Base Styles */
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      margin: 0;
      color: #fff;
      background-color: #1b1f22;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('/images/bg.jpg') bottom center/cover no-repeat fixed;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5); /* Dark overlay */
      z-index: -1;
    }

    body.bg-loaded::before {
      opacity: 1;
    }

    /* Hero Section */
    .hero {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    /* Container Styles */
    .content-container {
      background: rgba(0,0,0,0.6);
      padding: 3rem 2rem;
      max-width: 600px;
      position: relative;
      z-index: 2;
      width: 90%;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background-color: #fff;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 1rem;
      margin-bottom: 2rem;
    }

    .btn:hover {
      background-color: #e0e0e0;
      transform: translateY(-2px);
    }

    .back-link {
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s ease;
    }
    
    .back-link:hover {
        color: #fff;
        text-decoration: underline;
    }

    @media (max-width: 768px) {
      .hero {
        padding: 0;
        align-items: stretch;
      }
      
      .content-container {
        width: 100%;
        margin: 0;
        border-radius: 0;
        background: rgba(0,0,0,0.5);
        min-height: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
      }
      
      h1 {
          font-size: 2rem;
      }
    }
  </style>
</head>

      <p>We’re excited to hear your story. One of us will be in touch shortly to discuss how we can bring your vision to the screen.</p>

      <a href="/Diigima-Brochure.pdf" target="_blank" class="btn">Download Brochure</a>
      <br>
      <a href="/" class="back-link">Return to Homepage</a>
    </div>
  </section>
