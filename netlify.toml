[build]
  publish = "."

# Configuración de página de error 404
[[redirects]]
  from = "/*"
  to = "/404/"
  status = 404

# Cabeceras de Seguridad (Best Practices)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cacheo para archivos estáticos (imágenes, CSS, JS) para mejorar velocidad
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
